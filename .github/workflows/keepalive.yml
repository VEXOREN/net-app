name: Keepalive Supabase

# Darmowy plan Supabase usypia projekt po 7 dniach bez ruchu.
# Codzienne zapytanie do bazy utrzymuje go aktywnym.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping bazy
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Brak zmiennych SUPABASE_URL / SUPABASE_ANON_KEY w ustawieniach repo"
            exit 1
          fi
          curl -fsS --retry 3 --retry-delay 10 --max-time 30 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
          echo "Baza odpowiedziała, projekt aktywny."
